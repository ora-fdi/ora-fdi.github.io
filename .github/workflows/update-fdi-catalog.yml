name: Update FDI catalog

on:
  push:
    branches: [main]
    paths:
      - "incoming/*.zip"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-fdi-catalog
  cancel-in-progress: false

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Process Oracle ZIP files
        run: python scripts/update_catalog.py --incoming incoming --delete-zips

      - name: Show generated changes
        run: git status --short

      - name: Commit and push catalog update
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Oracle FDI catalog"
          git push
