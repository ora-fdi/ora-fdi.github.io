name: Deploy FDI catalog to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - "incoming/**"

  workflow_run:
    workflows:
      - "Update FDI catalog"
    types:
      - completed
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # For workflow_run, only deploy when the updater succeeded.
    # For push/workflow_dispatch, deploy normally.
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Show deployed commit
        run: |
          echo "Deploying:"
          git log -1 --oneline
          echo
          echo "README title:"
          head -n 5 README.md

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: .
          destination: ./_site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4